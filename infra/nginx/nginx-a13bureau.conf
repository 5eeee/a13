# Шаблон для /etc/nginx/sites-available/a13bureau
# Статика из dist/, API на :3001. SSL — certbot.

server {
    listen 80;
    listen [::]:80;
    server_name a13bureau.ru www.a13bureau.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name a13bureau.ru www.a13bureau.ru;

    ssl_certificate /etc/letsencrypt/live/a13bureau.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a13bureau.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/a13bureau/dist;
    index index.html;
    client_max_body_size 25m;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
